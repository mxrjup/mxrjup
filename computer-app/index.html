<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Explore Yute's Windows 95-inspired portfolio, showcasing React web development projects, retro UI designs, and interactive features." />
  <meta name="keywords"
    content="Yute, Windows 95 portfolio, React developer portfolio, retro web design, web development projects, UX/UI design, JavaScript projects, front-end development, full-stack development" />
  <meta name="author" content="Yute" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph Meta Tags for Social Sharing -->
  <meta property="og:title" content="Yute | Windows 95 React Developer Portfolio" />
  <meta property="og:description"
    content="Step into nostalgia with Yute's Windows 95-themed portfolio, featuring cutting-edge React web projects and interactive retro designs." />
  <meta property="og:image" content="/src/assets/95icon.png" />
  <meta property="og:url" content="https://yourportfolio.com" />
  <meta property="og:type" content="website" />

  <!-- Twitter Card Meta Tags -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Yute | Windows 95 React Developer Portfolio" />
  <meta name="twitter:description"
    content="Dive into Yute's retro-inspired portfolio built with React. Discover web development projects and nostalgic Windows 95 aesthetics." />
  <meta name="twitter:image" content="/src/assets/95icon.png" />

  <!-- Favicons -->
  <link rel="icon" type="image/png" href="/src/assets/95icon.png" />
  <link rel="apple-touch-icon" href="/src/assets/95icon.png" />

  <!-- The mine counter and the clock of Minesweeper. Loaded here rather than
       with an @import in MineSweeper.css, which a browser fetches from a third
       party before it may paint anything: media="print" takes it off that path
       and onload puts it back. Two elements of one game are not worth a blank
       screen. -->
  <link rel="stylesheet" href="https://fonts.cdnfonts.com/css/digital-dismay"
        media="print" onload="this.media='all'" />

  <!-- The preloads that used to be here named /src/main.jsx and /src/assets,
       paths that only exist while the dev server is running: the build turned
       each into a data: URI of the unbundled source that nothing ever read. -->

  <!-- Title -->
  <title>Family Computer</title>

  <script data-goatcounter="https://mxrjup.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>

<body>
  <div id="root" role="main" aria-label="Yute's Portfolio"></div>
  <script type="module" src="/src/main.jsx" defer></script>
</body>

</html>
