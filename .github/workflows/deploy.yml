name: Deploy to Infomaniak

on:
  push:
    branches: [ main ]

# Content commits from Sveltia CMS land on main like any other commit and should
# deploy: the CMS writes to the repository, not to the host, so a deploy is what
# puts new content and uploads on the server.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          script: |
            set -e
            # Path of the repository checkout on the host.
            cd ${{ secrets.INFOMANIAK_SITE_PATH }}

            # Reset rather than pull so the host always matches the repository,
            # which is the source of truth for content. Guest uploads under
            # server/uploads/users/ are git-ignored and are left untouched.
            git fetch origin main
            git reset --hard origin/main

            cd personal-site

            # Installs the Angular, server and computer-app dependencies
            # (the root postinstall handles the last two).
            npm ci

            # Builds dist/personal-site/browser and dist/computer, both served
            # by server/server.js.
            npm run build

            # Restart the Node.js site so the new build is picked up.
            # Passenger-style hosts watch this file; if your site restarts
            # another way, replace this line with that command.
            mkdir -p tmp && touch tmp/restart.txt
