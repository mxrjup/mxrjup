name: Deploy to Infomaniak

# Deploys the code, and only the code. Landing work on main changes nothing on the
# host; pushing a tag is what says "this is the version to run". A manual run from
# the Actions tab deploys the commit it was started on.
#
# Content is not deployed from here: it lives in mxrjup/mxrjup-content, whose own
# workflow pulls it into CONTENT_DIR on every push. Visitor data lives in
# VISITORS_DIR. Both are outside the code checkout, so this workflow never sees them.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two deploys at once would race on the same checkout, node_modules and dist.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          script: |
            set -e
            # Path of the code checkout on the host (CODE_DIR).
            cd "${{ secrets.INFOMANIAK_SITE_PATH }}"

            # The server writes nothing here, so anything git reports - a hot-fix
            # edited in place, a stray file - was put there by hand and exists
            # nowhere else. Stop rather than overwrite it: whoever made it decides
            # whether to commit it or throw it away. server/.env, node_modules/,
            # dist/ and tmp/ are ignored and do not count.
            changes="$(git status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::The server has local changes in $PWD; nothing was deployed."
              echo "$changes"
              echo "Commit them or discard them on the host, then run the deploy again."
              exit 1
            fi

            # Move to the exact commit this run is for, so a tag push and a manual
            # run behave the same. No --force and no reset: with a clean tree the
            # checkout can only fail loudly, never discard anything.
            git fetch origin --tags
            if ! git cat-file -e "${{ github.sha }}^{commit}"; then
              echo "::error::Commit ${{ github.sha }} is not on the host after the fetch."
              exit 1
            fi
            git checkout --detach "${{ github.sha }}"

            # Installs the Angular, server and computer-app dependencies (the root
            # postinstall runs npm ci in the last two). npm ci never rewrites a
            # lockfile: one out of step with its package.json fails here.
            npm ci

            # Builds dist/angular-mxrjup/browser and dist/computer, both served
            # by server/server.js.
            npm run build

            # Whatever the install or build leaves behind must be git-ignored,
            # otherwise the next deploy would refuse to run. Catch it now, while
            # the cause is obvious. The new build is in place but not restarted.
            changes="$(git status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::The install or build changed tracked files or left untracked ones."
              echo "$changes"
              echo "Ignore or commit them in the repository and tag again."
              exit 1
            fi

            # Restart the Node.js site so the new code and build are picked up.
            # Passenger-style hosts watch this file; if your site restarts
            # another way, replace this line with that command.
            mkdir -p tmp && touch tmp/restart.txt
            echo "Deployed $(git rev-parse --short HEAD) (${{ github.ref_name }})."
