name: Deploy to Infomaniak

# Deploys are cut deliberately, not by merging. Landing work on main changes
# nothing on the host; pushing a tag is what says "this is the version to run".
#
# Consequence worth knowing: content committed by Sveltia CMS lands on main like
# any other commit, so it now waits for the next tag (or a manual run below)
# before it reaches the site.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          key: ${{ secrets.INFOMANIAK_SSH_KEY }}
          script: |
            set -e
            # Path of the repository checkout on the host.
            cd ${{ secrets.INFOMANIAK_SITE_PATH }}

            # Reset rather than pull so the host always matches the repository,
            # which is the source of truth for content. Checking out the exact
            # commit this run was triggered for makes a tag push and a manual run
            # behave identically. Unversioned host state - server/.env, guest
            # uploads under server/uploads/users/, and the Spotify export in
            # server/data/timeline_spotify.json - is untracked, so it is left
            # untouched.
            git fetch origin --prune --tags --force
            git reset --hard ${{ github.sha }}

            # Installs the Angular, server and computer-app dependencies
            # (the root postinstall handles the last two).
            npm ci

            # Builds dist/angular-mxrjup/browser and dist/computer, both served
            # by server/server.js.
            npm run build

            # Restart the Node.js site so the new build is picked up.
            # Passenger-style hosts watch this file; if your site restarts
            # another way, replace this line with that command.
            mkdir -p tmp && touch tmp/restart.txt
