name: Deploy to Infomaniak

# Deploys the code, and only the code. Landing work on main changes nothing on the
# host; pushing a tag is what says "this is the version to run". A manual run from
# the Actions tab deploys the commit it was started on.
#
# Content is not deployed from here: it lives in mxrjup/mxrjup-content, whose own
# workflow pulls it into CONTENT_DIR on every push. Visitor data lives in
# VISITORS_DIR. Both are outside the code checkout, so this workflow never sees them.
#
# The server's configuration, server/.env, is written by this workflow from the
# repository's Actions variables (Settings > Secrets and variables > Actions >
# Variables), so GitHub is its only source and a new host needs no hand-written file.
# None of it is secret. Infomaniak's Node.js sites take no SSH key, so the connection
# uses the password of the site's SSH user (INFOMANIAK_SSH_PASSWORD).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two deploys at once would race on the same checkout, node_modules and dist.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # What goes into server/.env. The two paths are required; the others fall back to
    # the server's defaults when the variable is not set (see the README's table).
    env:
      ENV_CONTENT_DIR: ${{ vars.CONTENT_DIR }}
      ENV_VISITORS_DIR: ${{ vars.VISITORS_DIR }}
      ENV_USER_UPLOADS_QUOTA_MB: ${{ vars.USER_UPLOADS_QUOTA_MB }}
      ENV_MAX_FILE_SIZE_MB: ${{ vars.MAX_FILE_SIZE_MB }}
      ENV_TRUST_PROXY: ${{ vars.TRUST_PROXY }}
      ENV_NODE_ENV: ${{ vars.NODE_ENV || 'production' }}
    steps:
      # Refuse a configuration the server would misread before touching the host: a
      # missing path would silently fall back to the local-dev default.
      - name: Check the server configuration
        shell: bash
        run: |
          fail=0
          for name in ENV_CONTENT_DIR ENV_VISITORS_DIR; do
            case "${!name}" in
              /*) ;;
              *) echo "::error::Set the ${name#ENV_} variable to an absolute path."; fail=1 ;;
            esac
          done
          for name in ${!ENV_@}; do
            if [[ "${!name}" == *$'\n'* ]]; then
              echo "::error::The ${name#ENV_} variable spans several lines."
              fail=1
            fi
          done
          exit "$fail"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.INFOMANIAK_HOST }}
          username: ${{ secrets.INFOMANIAK_USER }}
          password: ${{ secrets.INFOMANIAK_SSH_PASSWORD }}
          # Passed on to the script below, which writes them to server/.env.
          envs: ENV_CONTENT_DIR,ENV_VISITORS_DIR,ENV_USER_UPLOADS_QUOTA_MB,ENV_MAX_FILE_SIZE_MB,ENV_TRUST_PROXY,ENV_NODE_ENV
          script: |
            set -e
            # Path of the code checkout on the host (CODE_DIR).
            cd "${{ secrets.INFOMANIAK_SITE_PATH }}"

            # The server writes nothing here, so anything git reports - a hot-fix
            # edited in place, a stray file - was put there by hand and exists
            # nowhere else. Stop rather than overwrite it: whoever made it decides
            # whether to commit it or throw it away. server/.env, node_modules/,
            # dist/ and tmp/ are ignored and do not count.
            changes="$(git status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::The server has local changes in $PWD; nothing was deployed."
              echo "$changes"
              echo "Commit them or discard them on the host, then run the deploy again."
              exit 1
            fi

            # Move to the exact commit this run is for, so a tag push and a manual
            # run behave the same. No --force and no reset: with a clean tree the
            # checkout can only fail loudly, never discard anything.
            git fetch origin --tags
            if ! git cat-file -e "${{ github.sha }}^{commit}"; then
              echo "::error::Commit ${{ github.sha }} is not on the host after the fetch."
              exit 1
            fi
            git checkout --detach "${{ github.sha }}"

            # Installs the Angular, server and computer-app dependencies (the root
            # postinstall runs npm ci in the last two). npm ci never rewrites a
            # lockfile: one out of step with its package.json fails here.
            npm ci

            # Builds dist/angular-mxrjup/browser and dist/computer, both served
            # by server/server.js.
            npm run build

            # Whatever the install or build leaves behind must be git-ignored,
            # otherwise the next deploy would refuse to run. Catch it now, while
            # the cause is obvious. The new build is in place but not restarted.
            changes="$(git status --porcelain)"
            if [ -n "$changes" ]; then
              echo "::error::The install or build changed tracked files or left untracked ones."
              echo "$changes"
              echo "Ignore or commit them in the repository and tag again."
              exit 1
            fi

            # Write server/.env last, so the configuration changes together with the
            # code, at the restart. It goes to tmp/ first (git-ignored, same disk)
            # and is renamed into place, so the server never reads half a file.
            mkdir -p tmp
            {
              echo '# Written by .github/workflows/deploy.yml from the repository'"'"'s'
              echo '# Actions variables. Edit them on GitHub, not here: the next deploy'
              echo '# overwrites this file.'
              for name in CONTENT_DIR VISITORS_DIR USER_UPLOADS_QUOTA_MB MAX_FILE_SIZE_MB \
                  TRUST_PROXY NODE_ENV; do
                value="$(printenv "ENV_$name" || true)"
                if [ -n "$value" ]; then printf '%s=%s\n' "$name" "$value"; fi
              done
            } > tmp/server.env
            mv tmp/server.env server/.env
            echo "Wrote server/.env:"
            sed 's/^/  /' server/.env

            # Restart the Node.js site so the new code, build and configuration are
            # picked up. Passenger-style hosts watch this file; if the site does not
            # restart on its own, restart it from the Infomaniak Manager.
            touch tmp/restart.txt
            echo "Deployed $(git rev-parse --short HEAD) (${{ github.ref_name }})."
